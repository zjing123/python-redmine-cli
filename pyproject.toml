[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redmine-cli"
version = "0.1.0"
description = "Agent-friendly CLI for Redmine project management, powered by python-redmine"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
dependencies = [
    "python-redmine>=2.5.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
]

[project.scripts]
redmine-cli = "redmine_cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
include = ["redmine_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
